[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fclass"
version = "2.0.0"
description = "Sort your files by what they contain, using a small model running on your own computer."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []  # core is standard library only

[project.optional-dependencies]
pdf = ["pypdf>=4"]
dev = ["pytest>=8"]

[project.scripts]
fclass = "fclass.cli:main"
file-classifier = "fclass.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fclass"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
