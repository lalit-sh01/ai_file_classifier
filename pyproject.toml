[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fclass"
version = "2.2.0"
description = "An offline file organiser: small models on your computer sort any file into your categories, and ask when unsure."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["pypdf>=4"]  # pure Python; everything else is the standard library

[project.optional-dependencies]
pdf = []  # kept so `fclass[pdf]` installs keep working
dev = ["pytest>=8"]

[project.scripts]
fclass = "fclass.cli:main"
file-classifier = "fclass.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fclass"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
